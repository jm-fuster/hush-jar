<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --text: var(--figma-color-text, #1d1d1f);
    --muted: var(--figma-color-text-secondary, #6b6b66);
    --border: var(--figma-color-border, #e2e2dc);
    --field: var(--figma-color-bg-secondary, #f6f6f2);
    --accent: #1d1d1f;
    --on-accent: #ffffff;
    --ok: #0b6b2e;
    --warn: #8a5300;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 18px 14px; font: 13px/1.5 Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); }
  /* Los textos llegan con el idioma del tarro: hasta entonces no se enseña nada. */
  body:not(.ready) { visibility: hidden; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 10px; padding: 3px 9px; border-radius: 999px; background: var(--field); color: var(--muted); font-size: 11px; font-weight: 600; }
  h1 { margin: 0 0 12px; font-size: 16px; line-height: 1.35; font-weight: 700; }
  .cols { display: none; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .cols.on { display: flex; }
  .col { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 999px; background: var(--bg); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; }
  .col[aria-pressed="true"] { border-color: var(--text); font-weight: 700; }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .15); }
  textarea { width: 100%; height: 100px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--field); color: var(--text); font: inherit; font-size: 14px; resize: none; outline: none; }
  textarea:focus { border-color: var(--text); }
  textarea:disabled { opacity: .55; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .actions { display: flex; gap: 8px; }
  .count { color: var(--muted); font-size: 12px; }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.main { padding: 8px 14px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.ghost { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); font-weight: 600; }
  button.small { padding: 4px 9px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text); font-size: 12px; font-weight: 600; }
  button.small.danger { color: #a1161b; border-color: #eba3a5; }
  #status { min-height: 20px; margin: 10px 0 0; font-size: 13px; }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }
  .mine { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .mine[hidden] { display: none; }
  .mine-title { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .mine ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .mine li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; }
  .mine li.editing { border-color: var(--text); }
  .mine .text { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  [hidden] { display: none !important; }
  .help { margin: -4px 0 10px; color: var(--muted); }
  .notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow: auto; }
  .note { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; text-align: left; }
  .note[aria-pressed="true"] { border-color: var(--text); font-weight: 600; }
  .note .text { flex: 1; min-width: 0; }
  .check { flex: none; width: 18px; height: 18px; border: 1.5px solid var(--border); border-radius: 50%; display: grid; place-items: center; font-size: 11px; }
  .note[aria-pressed="true"] .check { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .foot { display: flex; justify-content: flex-end; margin-top: 12px; }
</style>
</head>
<body>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="question"></h1>
  <section id="voteView" hidden>
    <p class="help" id="voteHelp"></p>
    <ul class="notes" id="notes"></ul>
    <div class="row">
      <span class="count" id="votesLeft"></span>
      <button id="saveVotes" class="main"></button>
    </div>
  </section>
  <section id="writeView">
  <div class="cols" id="cols" role="group"></div>
  <textarea id="idea" maxlength="280"></textarea>
  <div class="row">
    <span class="count" id="count">0/280</span>
    <div class="actions">
      <button id="cancel" class="ghost" hidden></button>
      <button id="seal" class="main" disabled></button>
    </div>
  </div>
  </section>
  <p id="status"></p>
  <section class="mine" id="mineBox" hidden>
    <p class="mine-title"><span id="mineTitle"></span> · <span id="mineCount">0</span></p>
    <ul id="mineList"></ul>
  </section>
  <div class="foot"><button id="close" class="ghost"></button></div>
<script>
  const $ = (id) => document.getElementById(id);
  const send = (msg) => parent.postMessage({ pluginMessage: msg }, '*');

  // Claves aleatorias fuertes: el hilo del widget no tiene crypto, el iframe sí.
  function randomHex(bytes) {
    const a = new Uint8Array(bytes);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  // Textos en el idioma del tarro: llegan con `init` (están en widget-src/textos.ts).
  // En ellos, {s} son segundos y {col} el nombre de una columna.
  let T = {};
  const tx = (key, vars) => String(T[key] || '').replace(/\{(\w+)\}/g, (all, name) => (vars && name in vars ? vars[name] : ''));

  let columns = [];
  let column = null;
  let mine = [];          // tus ideas que siguen en el tarro: { key, t, c }
  let editing = null;     // clave de la idea que estás editando
  let confirming = null;  // clave de la idea que vas a retirar (pide confirmación)
  let busy = false;       // hay un guardado en curso

  function setStatus(text, kind) {
    $('status').className = kind || '';
    $('status').textContent = text;
  }

  let resizeQueued = false;
  function requestResize() {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => {
      resizeQueued = false;
      send({ type: 'resize', height: document.documentElement.scrollHeight });
    });
  }

  function applyTexts() {
    $('eyebrow').textContent = T.eyebrow;
    $('cols').setAttribute('aria-label', T.column);
    $('idea').placeholder = T.placeholder;
    $('cancel').textContent = T.cancel;
    $('seal').textContent = editing ? T.saveChanges : T.seal;
    $('mineTitle').textContent = T.mine;
    $('close').textContent = T.close;
  }

  function refresh() {
    $('count').textContent = $('idea').value.length + '/280';
    $('seal').disabled = busy || $('idea').value.trim().length === 0;
    $('idea').disabled = busy;
  }

  function colorOf(id) {
    const c = columns.find((x) => x.id === id);
    return c ? c.hex : '#FFE8A3';
  }

  function columnLabel(id) {
    const c = columns.find((x) => x.id === id);
    return c ? c.label : '';
  }

  function paintColumns() {
    const box = $('cols');
    box.innerHTML = '';
    box.classList.toggle('on', columns.length > 1);
    for (const c of columns) {
      const b = document.createElement('button');
      b.className = 'col';
      b.type = 'button';
      b.setAttribute('aria-pressed', String(c.id === column));
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = c.hex;
      b.append(dot, document.createTextNode(c.label));
      b.onclick = () => { column = c.id; paintColumns(); $('idea').focus(); };
      box.appendChild(b);
    }
  }

  function smallButton(label, onClick, danger) {
    const b = document.createElement('button');
    b.className = 'small' + (danger ? ' danger' : '');
    b.type = 'button';
    b.textContent = label;
    b.disabled = busy;
    b.onclick = onClick;
    return b;
  }

  function renderMine() {
    $('mineBox').hidden = mine.length === 0;
    $('mineCount').textContent = String(mine.length);
    const list = $('mineList');
    list.innerHTML = '';
    for (const item of mine) {
      const li = document.createElement('li');
      if (item.key === editing) li.classList.add('editing');
      if (columns.length > 1) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.title = columnLabel(item.c);
        dot.style.background = colorOf(item.c);
        li.appendChild(dot);
      }
      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = item.t;
      li.appendChild(text);
      li.appendChild(smallButton(T.edit, () => startEdit(item)));
      li.appendChild(smallButton(confirming === item.key ? T.sure : T.remove, () => retract(item), true));
      list.appendChild(li);
    }
    requestResize();
  }

  function startEdit(item) {
    if (busy) return;
    editing = item.key;
    confirming = null;
    column = item.c;
    paintColumns();
    $('idea').value = item.t;
    $('seal').textContent = T.saveChanges;
    $('cancel').hidden = false;
    setStatus(T.editing);
    refresh();
    renderMine();
    $('idea').focus();
  }

  function stopEdit() {
    editing = null;
    $('idea').value = '';
    $('seal').textContent = T.seal;
    $('cancel').hidden = true;
    refresh();
  }

  function retract(item) {
    if (busy) return;
    if (confirming !== item.key) {
      confirming = item.key;
      renderMine();
      return;
    }
    confirming = null;
    busy = true;
    refresh();
    renderMine();
    send({ type: 'retract', key: item.key });
  }

  function seal() {
    const text = $('idea').value.trim();
    if (!text || busy) return;
    busy = true;
    confirming = null;
    refresh();
    renderMine();
    if (editing) send({ type: 'edit', key: editing, text, c: column });
    else send({ type: 'seal', key: randomHex(12), text, c: column });
  }

  function done() {
    busy = false;
    refresh();
    renderMine();
    $('idea').focus();
  }

  // ---------- votar ----------
  let notes = [];
  let max = 3;
  let chosen = [];

  function renderVotes() {
    const list = $('notes');
    list.innerHTML = '';
    for (const n of notes) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'note';
      const on = chosen.includes(n.id);
      b.setAttribute('aria-pressed', String(on));
      b.disabled = busy || (!on && chosen.length >= max);
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = n.hex;
      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = n.t;
      const check = document.createElement('span');
      check.className = 'check';
      check.textContent = on ? '✓' : '';
      b.append(dot, text, check);
      b.onclick = () => {
        chosen = on ? chosen.filter((id) => id !== n.id) : chosen.concat(n.id);
        setStatus('');
        renderVotes();
      };
      li.appendChild(b);
      list.appendChild(li);
    }
    $('votesLeft').textContent = tx('votesLeft', { n: max - chosen.length, max });
    $('saveVotes').disabled = busy;
    requestResize();
  }

  $('saveVotes').onclick = () => {
    if (busy) return;
    busy = true;
    renderVotes();
    send({ type: 'vote', ids: chosen });
  };

  window.onmessage = (event) => {
    const m = event.data && event.data.pluginMessage;
    if (!m) return;
    if (m.type === 'init' && m.mode === 'vote') {
      T = m.text || T;
      if (m.lang) document.documentElement.lang = m.lang;
      applyTexts();
      $('eyebrow').textContent = T.voteEyebrow;
      $('voteHelp').textContent = T.voteHelp;
      $('saveVotes').textContent = T.saveVotes;
      $('question').textContent = m.question || '';
      $('writeView').hidden = true;
      $('voteView').hidden = false;
      notes = m.notes || [];
      max = m.max || 3;
      chosen = m.chosen || [];
      renderVotes();
      document.body.classList.add('ready');
      return;
    }
    if (m.type === 'voted') {
      busy = false;
      chosen = m.ids || chosen;
      setStatus(T.votesSaved, 'ok');
      renderVotes();
    }
    if (m.type === 'refused' && notes.length) {
      busy = false;
      setStatus(m.text, 'warn');
      renderVotes();
      return;
    }
    if (m.type === 'init') {
      T = m.text || T;
      if (m.lang) document.documentElement.lang = m.lang;
      applyTexts();
      $('question').textContent = m.question || T.fallbackQuestion;
      columns = m.columns || [];
      column = columns.length ? columns[0].id : null;
      mine = m.mine || [];
      paintColumns();
      renderMine();
      document.body.classList.add('ready');
      $('idea').focus();
    }
    if (m.type === 'sealing') {
      const what = m.action === 'edit' ? T.savingEdit : m.action === 'retract' ? T.removing : T.saving;
      setStatus(what + tx('delay', { s: m.seconds }));
    }
    if (m.type === 'saved') {
      mine.push({ key: m.key, t: m.t, c: m.c });
      $('idea').value = '';
      const first = columns.length > 1 && m.c ? tx('savedIn', { col: columnLabel(m.c) }) : T.saved;
      setStatus(first + ' ' + (m.late ? T.late : T.next), 'ok');
      done();
    }
    if (m.type === 'edited') {
      const item = mine.find((x) => x.key === m.key);
      if (item) { item.t = m.t; item.c = m.c; }
      stopEdit();
      setStatus(T.edited, 'ok');
      done();
    }
    if (m.type === 'retracted') {
      mine = mine.filter((x) => x.key !== m.key);
      if (editing === m.key) stopEdit();
      setStatus(T.removed, 'ok');
      done();
    }
    if (m.type === 'refused') {
      if (m.key) mine = mine.filter((x) => x.key !== m.key);
      if (editing && (!m.key || editing === m.key)) stopEdit();
      setStatus(m.text, 'warn');
      done();
    }
  };

  $('idea').addEventListener('input', refresh);
  $('idea').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) seal();
    if (e.key === 'Escape' && editing) { stopEdit(); setStatus(''); renderMine(); }
  });
  $('seal').onclick = seal;
  $('cancel').onclick = () => { stopEdit(); setStatus(''); renderMine(); };
  $('close').onclick = () => send({ type: 'close' });
  send({ type: 'ready', token: randomHex(16) });
</script>
</body>
</html>
